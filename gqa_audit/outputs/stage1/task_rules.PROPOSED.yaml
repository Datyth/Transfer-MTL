schema_version: 1
status: PROPOSED
seed: 0
eligibility:
  binary_answers:
  - 'yes'
  - 'no'
  require_nonempty_semantic: true
diagnostics:
  samples_per_type: 5
  semantic_filter_task: exist
  semantic_filter_value: obj
  taxonomy_checks:
    logic:
      structural: logical
    verifyRel:
      semantic: rel
    verifyAttr:
      semantic: attr
    compare:
      semantic: attr
  exhaustive_taxonomy_tasks:
  - logic
audit_variants:
  unfiltered: {}
  program_strict:
    exist:
      relation: R_strict
    verifyAttr:
      relation: R_strict
    compare:
      relation: R_strict
  program_broad:
    exist:
      relation: R_broad
    verifyAttr:
      relation: R_broad
    compare:
      relation: R_broad
  semantic_sensitivity:
    exist:
      types_semantic: obj
    verifyAttr:
      relation: R_strict
    compare:
      relation: R_strict
pilot_tasks:
  exist:
    exclude_relation: true
  verifyAttr:
    exclude_relation: true
  verifyRel:
    exclude_relation: false
  compare:
    exclude_relation: true
  logic:
    exclude_relation: false
proposal_patterns:
- regex: ^(existAnd|existOr|existAttrOr|existThatOr).*$
  task: logic
  reason: Observed and/or composition; overlaps the exist family and needs human review
  ambiguous: true
- regex: ^(verifyAttrAnd|verifyAttrs|verifyMaterialAnd).*$
  task: logic
  reason: Observed and composition; overlaps attribute verification and needs human review
  ambiguous: true
- regex: ^relVerify.*$
  task: verifyRel
  reason: Observed GQA relation-verification family; programs contain verify rel
- regex: ^exist.*$
  task: exist
  reason: Intended GQA exist family
- regex: ^verifyAttr.*$
  task: verifyAttr
  reason: Intended GQA attribute verification family
- regex: ^verifyRel.*$
  task: verifyRel
  reason: Intended GQA relation verification family
- regex: ^(twoSame|twoDiff|twoDifferent).*$
  task: compare
  reason: Pooling twoSame and twoDifferent needs human review
  ambiguous: true
- regex: ^(logicAnd|logicOr).*$
  task: logic
  reason: Intended GQA logic family; pooling and/or needs human review
  ambiguous: true
unmatched_task: secondary
unmatched_reason: Outside the intended pilot families; review before freezing
relation_definitions:
  R_strict:
    operation_heads:
    - relate
  R_broad:
    operation_regexes:
    - (^relate(\s|$)|\brel\b|\brelation\b)
    argument_regexes:
    - ^[^,]+,[^,]+,[so](\s*\([^)]*\))?$
