schema_version: 1
status: FROZEN
name: analysis_plan
applies_to_registry_sha256: c122aac0bbb9ed8ad6eaa93843d95df664ba75c767946003e90ff2469c27b451
pins:
  blind_predictions.csv_sha256: 9cbd7f95fed1aa49301cdd6c86b4ff5cc35af26ccc3bf732554098dd66413c00
  task_rules_sha256: 2f2ce20ebd8ee804f5180cd52280dfbf739ec392a70738552ce0cc6abe05285a
decisions:
  H: Primary verifyRel metric = balanced accuracy on the verifyRel_relation subset {relVerify, relVerifyCr}. Pooled verifyRel
    accuracy and the verifyRel_Co subset are secondary.
  I: 'Logic keeps its frozen target. Two analysis subsets are pre-registered before any model training: logic_no_not_cue and
    text_hard (all tasks). Main logic results are also reported on both.'
  J: Every transfer edge is reported next to its target blind-baseline gain, and on the target text_hard subset.
  K: RQ2 is tested primarily at question level, with operation-subtype descriptors (operation strings without arguments).
    Task-level overlap is descriptive only.
  L: testdev results are reported only per stratum and per family, never pooled against val.
metrics:
  per_task_primary:
    exist: accuracy
    verifyAttr: accuracy
    compare: accuracy
    logic: accuracy
    verifyRel: balanced_accuracy@verifyRel_relation
  always_also_report:
  - accuracy
  - balanced_accuracy
  - yes_prediction_rate
  - n
  balanced_accuracy: mean of recall(yes) and recall(no)
  confidence_intervals:
    method: cluster bootstrap over imageId
    resamples: 1000
    seed: 0
    level: 0.95
  unit_of_reporting: task, family, stratum, subset; never a single detailed type
subsets:
  verifyRel_relation:
    task: verifyRel
    detailed_types:
    - relVerify
    - relVerifyCr
  verifyRel_Co:
    task: verifyRel
    detailed_types:
    - relVerify
    - relVerifyCo
    role: secondary (object-absence/text-prior shortcut)
  logic_no_not_cue:
    task: logic
    exclude_if:
      family: existThatOr
      question_regex: (?i)\bnot\b|n't\b
    parts:
    - train_core
    - dev
    - val
    - testdev_at_final_eval_only
  text_hard:
    definition: questions whose frozen question-only baseline prediction is wrong, using the same variant and task model
    source: outputs/stage2/blind_predictions.csv (sha256 pinned)
    parts:
    - dev
    - val
    testdev_rule: 'at final evaluation only: refit the frozen baseline on train_core, verify it reproduces blind_predictions.csv
      for dev and val exactly, then apply to testdev'
descriptors:
  operation_token: the full step operation string, stripped (e.g. "verify color", "filter material", "relate", "exist", "and")
  negation_token: if the step argument starts with "not(", also emit "<operation> [neg]"
  excluded:
  - select (present in every program; kept only in a separate with_select variant)
  - all arguments
  - object IDs
  - the (-) marker
  - types.detailed
  - family
  - task
  vocabulary: frozen from program_strict train_core; tokens unseen there map to UNSEEN
  question_level_overlap:
    binary: question has >=1 non-select token in the source task train_core vocabulary
    continuous: sum over the question non-select token set of the source task train_core document frequency
  controls_for_instance_analysis:
  - program_length
  - depth
  - family
  - answer
  - stratum
shortcut_control_table_columns:
- source
- target
- condition
- metric
- value
- ci_low
- ci_high
- value_on_text_hard
- target_blind_gain_val
- target_no_image_gain (filled in Stage 3)
testdev_policy: sealed; counts only until final evaluation; final results per stratum and family only
